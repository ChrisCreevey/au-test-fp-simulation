name: au_test_sim
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python and core
  - python=3.11
  - pip

  # Phylogenetics -- the only external tool the pipeline calls. Sequence
  # simulation uses IQTree's own AliSim (--alisim), not a separate simulator.
  - iqtree2>=2.2

  # Optional but recommended
  - git
  - vim
  - less

variables:
  IQTREE_BIN: iqtree2
  PYTHON_BIN: python
