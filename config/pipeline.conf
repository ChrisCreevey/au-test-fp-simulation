#!/bin/bash
# Configuration for the AU test false positive rate simulation pipeline.
# Sourced by every scripts/*.sh step, and by run_family.sh / run_family_chunk.sh.

# ============================================================================
# DIRECTORIES
# ============================================================================

# Root directory of the project (auto-detected, but can override)
PROJECT_DIR="${PROJECT_DIR:-.}"

# Source code (Python utilities), read by the step scripts as $SRC_DIR
SRC_DIR="${PROJECT_DIR}/src"

# ============================================================================
# SIMULATION PARAMETERS
# ============================================================================

# Number of simulated replicates per domain. 10 is the current bulk-run
# default (see CLAUDE.md for the cost/precision tradeoff against going
# higher -- population-level FP rate estimates are already well-powered at
# N=10 pooled across thousands of families; per-family precision is what a
# higher N buys, at a cost that scales close to linearly with N unless
# REPLICATE_JOBS is also raised to match).
N_REPLICATES=10

# AU test RELL bootstrap replicates (IQTree's -zb).
N_BOOTSTRAP=1000

# ============================================================================
# EXTERNAL TOOLS
# ============================================================================

# IQTree2 executable (v2.2+, needs AliSim and MFP support). This is the only
# external phylogenetics tool the pipeline calls -- sequence simulation uses
# IQTree's own AliSim (--alisim), not a separate simulator.
IQTREE_BIN="${IQTREE_BIN:-/mnt/scratch2/igfs-anaconda/conda-envs/iqtree/bin/iqtree2}"

# Python executable (3.8+, standard library only -- no extra packages required)
PYTHON_BIN="${PYTHON_BIN:-python3}"

# ============================================================================
# PARALLELIZATION
# ============================================================================

# Local fallback thread count, used only to compute HPC_THREADS below when
# not running under SLURM/SGE.
LOCAL_THREADS=4

# Auto-detected from the job scheduler; falls back to LOCAL_THREADS locally.
HPC_THREADS="${SLURM_CPUS_PER_TASK:-${SGE_NSLOTS:-${LOCAL_THREADS}}}"

# Number of replicates to process concurrently in Steps 4/5 (tree
# reconstruction, AU test) via `xargs -P`. Replicates are independent, so
# this is the main lever for wall-clock speed -- it should not exceed the
# number of cores actually allocated to the job (see CLAUDE.md's discussion
# of REPLICATE_JOBS vs --cpus-per-task and the batching this causes when
# N_REPLICATES > REPLICATE_JOBS). Respects a pre-exported override.
REPLICATE_JOBS="${REPLICATE_JOBS:-$HPC_THREADS}"

# Threads given to each individual IQTree2 invocation (-T flag). Left at 1:
# for typical gene-family-sized alignments (tens to low hundreds of taxa,
# ~1000 sites), IQTree's per-run multithreading speedup is poor, so running
# many single-threaded replicates concurrently (REPLICATE_JOBS above) beats
# multithreading each one. Increase only for individual families with very
# large alignments. Respects a pre-exported override.
IQTREE_THREADS_PER_JOB="${IQTREE_THREADS_PER_JOB:-1}"

# ============================================================================
# RERUN BEHAVIOUR
# ============================================================================

# Every step script skips work it finds already done, unless this is true
# (or -f/-x is passed on the command line, which overrides this default --
# see the CLI_FORCE_RERUN pattern in each script). This is what makes it
# safe to batch many families per SLURM array task and resume a
# killed/resubmitted run without redoing completed steps.
FORCE_RERUN=false
