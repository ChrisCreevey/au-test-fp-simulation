#!/bin/bash
# Configuration file for AU test false positive rate simulation pipeline

# ============================================================================
# DIRECTORIES
# ============================================================================

# Root directory of the project (auto-detected, but can override)
PROJECT_DIR="${PROJECT_DIR:-.}"

# Base inputs directory (individual RHG dirs specified via -i flag)
INPUTS_DIR="${PROJECT_DIR}/inputs"

# Default output directory (individual RHG dirs specified via -o flag)
DEFAULT_OUTPUT_DIR="${PROJECT_DIR}/outputs"

# Script directory
SCRIPT_DIR="${PROJECT_DIR}/scripts"

# Source code (utilities)
SRC_DIR="${PROJECT_DIR}/src"

# ============================================================================
# SIMULATION PARAMETERS
# ============================================================================

# Number of sequence replicates per RHG
N_REPLICATES=10

# Number of bootstrap replicates for tree inference
N_BOOTSTRAP=1000

# ============================================================================
# EXTERNAL TOOLS (paths to executables)
# ============================================================================

# IQTree executable (must be v2.0+)
IQTREE_BIN="${IQTREE_BIN:-iqtree2}"

# SeqGen executable
SEQGEN_BIN="${SEQGEN_BIN:-seq-gen}"

# MAFFT (optional, only if re-trimming simulated sequences)
MAFFT_BIN="${MAFFT_BIN:-mafft}"

# Python executable
PYTHON_BIN="${PYTHON_BIN:-python3}"

# GNU Parallel (for parallelization; optional)
PARALLEL_BIN="${PARALLEL_BIN:-parallel}"

# ============================================================================
# PARALLELIZATION (LOCAL)
# ============================================================================

# Number of parallel jobs to run locally (per RHG)
# Set to 1 for serial execution, or number of CPU cores available
LOCAL_THREADS=4

# For HPC: these are usually set via SLURM/SGE environment variables
# and override the local settings
HPC_THREADS="${SLURM_CPUS_PER_TASK:-${SGE_NSLOTS:-${LOCAL_THREADS}}}"

# Number of concurrent replicates to process in Steps 4/5 (tree reconstruction,
# AU test). Replicates are independent, so this is the main lever for wall-clock
# speed. Defaults to HPC_THREADS (set above).
REPLICATE_JOBS="${HPC_THREADS}"

# Threads given to each individual IQTree2 invocation (-T flag).
# For typical gene-family-sized alignments (tens of taxa, ~1000 sites), IQTree's
# per-run parallel speedup is poor and multithreading mostly adds overhead.
# It is more efficient to run many single-threaded replicates concurrently
# (controlled by REPLICATE_JOBS above) than to multithread each one.
# Increase this only if individual alignments are large (100s of taxa / long sequences).
IQTREE_THREADS_PER_JOB=1

# ============================================================================
# PIPELINE STEPS TO RUN
# ============================================================================

# Set to 'true' to run, 'false' to skip
RUN_STEP1_BRANCH_LENGTHS=true
RUN_STEP2_SEQGEN=true
RUN_STEP3_MASKING=true
RUN_STEP4_TREE_RECONSTRUCTION=true
RUN_STEP5_AU_TEST=true
RUN_STEP6_SUMMARIZE=true

# Force re-run even if output exists
# Note: If constrained tree already has branch lengths, Step 1 will be auto-skipped
# unless FORCE_RERUN=true (to force recalculation of branch lengths)
FORCE_RERUN=false

# ============================================================================
# LOGGING AND DEBUGGING
# ============================================================================

# Verbosity: 0=silent, 1=errors only, 2=warnings, 3=info, 4=debug
VERBOSITY=2

# Keep intermediate files (set to false to save disk space)
KEEP_INTERMEDIATES=true

# Write detailed logs for each step
LOG_DIR="${DEFAULT_OUTPUT_DIR}/logs"

# ============================================================================
# HPC SETTINGS (for SLURM or SGE)
# ============================================================================

# Job name (for SLURM sbatch)
HPC_JOB_NAME="AU_test_sim"

# Job queue/partition
HPC_QUEUE="default"

# Wall-clock time per RHG (HH:MM:SS format)
HPC_TIME_PER_RHG="02:00:00"

# Memory per job (in GB)
HPC_MEMORY_PER_JOB=8

# Number of CPU cores per job
HPC_CPUS_PER_JOB=4

# Email notifications (set to empty string to disable)
HPC_EMAIL="${SLURM_SUBMIT_DIR:+user@example.com}"

# ============================================================================
# VALIDATION
# ============================================================================

# Validate all inputs before running (recommended)
VALIDATE_INPUTS=true

# Stop pipeline if validation fails
VALIDATE_STRICT=true
